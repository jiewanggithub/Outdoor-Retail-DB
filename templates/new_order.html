{% extends 'base.html' %}
{% block content %}
<form method="post">
<div>
<label>Customer
<select name="customer_id" required>
{% for c in customers %}
<option value="{{ c[0] }}">{{ c[1] }} (ID {{ c[0] }})</option>
{% endfor %}
</select>
</label>
<label>Account
<select name="account_id" required>
{% for a in accounts %}
<option value="{{ a[0] }}">Account {{ a[0] }} (Customer {{ a[1] }})</option>
{% endfor %}
</select>
</label>
</div>
<div>
<label>Store
<select name="store_id" required>
{% for s in stores %}
<option value="{{ s[0] }}">{{ s[1] }}</option>
{% endfor %}
</select>
</label>
<label>Item
<select name="item_id" required>
{% for i in items %}
<option value="{{ i[0] }}" data-price="{{ i[2] }}">{{ i[1] }} (${{ i[2] }})</option>
{% endfor %}
</select>
</label>
</div>
<div>
<label>Quantity <input name="quantity" type="number" min="1" value="1" required></label>
<label>Unit Price <input name="unit_price" type="number" step="0.01" min="0" value="0" required></label>
</div>
<button type="submit">Create Order</button>
</form>
<p style="opacity:.7">Tip: Set unit price to the item price above, or allow discounts.</p>
{% endblock %}
